<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./product.css" />
  </head>
  <body>
    <nav>
      <li><a href="./Home.html">HOME</a></li>
      <li><a href="./Product.html">Product</a></li>
      <li><a href="./cart.html">Cart</a></li>
      <li><a href="./auth.html">Login/Signup</a></li>
    </nav>

    <h1>Products</h1>

    <section id="products"></section>

    <script>
      let section = document.getElementById("products");
      let products = [];

      async function loadProducts() {
        try {
          let response = await fetch("https://fakestoreapi.com/products");
          products = await response.json();

          section.innerHTML = products
            .map(({ title, price, image, id }) => {
              return `
                <div class="user-card">
                  <img src="${image}" alt="${title}" />
                  <h3 class="title">${title}</h3>
                  <h4 class="price">₹${price}</h4>
                  <button onclick="addToCart(${id})" class="button">Add to Cart</button>
                </div>`;
            })
            .join("");
        } catch (error) {
          section.innerHTML = "<h2>Unable to load products. Please try again.</h2>";
        }
      }

      function addToCart(id) {
        let product = products.find((item) => item.id === id);
        if (!product) {
          alert("Product is not available right now.");
          return;
        }

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let existingItem = cart.find((item) => item.id === product.id);

        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert("Product added to cart!");
      }

      loadProducts();
    </script>
  </body>
</html>
